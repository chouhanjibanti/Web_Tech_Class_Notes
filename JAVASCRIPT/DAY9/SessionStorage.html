<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      email : <input type="email" placeholder="Enter Email" id="email" /> <br />
      Password : <input type="text" id="pass" /> <br />
      name : <input type="text" placeholder="Enter name" id="name" /> <br />
      id : <input type="number" id="id1" /> <br />
      Gender: <input type="text" id="gender">
      <button id="btn">Submit</button> <br />
      <br />

      <!-- logic for the data get -->
      <input type="number" placeholder="Enter id for get data" id="id2" />
      <button id="btn2">GetData</button>
    </form>

    <p id="result"></p>

    <script>
      let btn1 = document.getElementById("btn");

      btn1.onclick = function (e) {
        let email = document.getElementById("email").value;
        let password = document.getElementById("pass").value;
        let name = document.getElementById("name").value;
        let gender = document.getElementById("gender").value;
        let id = document.getElementById("id1").value;


        let userData = {
          name: name,
          password: password,
          email:email,
          gender:gender
        };

        window.sessionStorage.setItem(id, JSON.stringify(userData));
        alert(
          "Data saved successfully............................................"
        );
      };

      // ===================================================

      // logic for data get
      let btn2 = document.getElementById("btn2");
      btn2.onclick = function (e) {
        e.preventDefault(); // by deault behavious of the html form -> refresh
        let id2 = document.getElementById("id2").value;

        let userData1 = window.sessionStorage.getItem(id2);
        if (userData1 !== null) {
          let obj = JSON.parse(userData1);
          document.getElementById("result").innerText =
            "password = " +
            obj.password +
            " and  email  " +
            obj.email +
            " and  name : " +
            obj.name  +
            " and  gender : " +
            obj.gender;
        } else {
          document.getElementById("result").innerText = "data not found";
        }
      };
    </script>
  </body>
</html>
<!-- id , email , password , name , gender -->      
 <!-- key :- id
  value :- email , passwod , name ,gender -->
