<body>
    <script>
       let myPromise = new Promise((resolve,reject)=>{
           let day = "gm"
           if (day==="gm") {
                resolve("goodmoring")
           } else {
              reject("goodEvening")
           }
        })
        myPromise.then((data)=>{
            console.log(data);
        }).catch((err)=>{
            console.log(err);
        }).finally(()=>{
            // connection close
            console.log("hy i am finally block");
        })
    </script>
</body>
