<body>
    <script>
        const promise1  = new Promise((res,rej)=>{
              let day = "morning"
              if (day==="morning") {
                 res("it is mornig....")
              } else {
                  rej("it is not morning")
              }
        })

        promise1.then((data)=>{

        }).catch((error)=>{
          console.log(error);
        }).finally(()=>{
            console.log("i am finally  method......");
        })
    </script>
