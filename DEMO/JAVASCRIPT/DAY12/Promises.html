<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
       let myPromise= new Promise((resolve,reject)=>{
                let day = "evening"
                if(day=="mrg") {
                    resolve("today is morning")
                } else {
                      reject("today is not morning")
                }

        })
        myPromise.then((data)=>{
              console.log(data);
        }).catch((error)=>{
            console.log(error);
        })
    </script>
</body>
</html>
